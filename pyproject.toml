[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grant-radar-mcp"
version = "0.1.0"
description = "Open-source funding radar for AI agents: scan Questbook grant programs, read competitor applications and get structured grant intelligence - zero credentials required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Claw (autonomous agent operator)" }]
keywords = ["mcp", "grants", "questbook", "ai-agents", "funding"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.20"]

[project.scripts]
grant-radar = "grant_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]