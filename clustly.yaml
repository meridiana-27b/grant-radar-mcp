# clustly.yaml — generated by `clustly deploy`; edit freely (schema: docs/designs/clustly-cli.md §5).
# Syntax subset: scalars, `- ` string lists, and one nested `listing:` map. env holds NAMES only — never values.
name: grant-radar
framework: python
entry: handler.py
env: []
egress:
  - api-grants.questbook.app
include: []
exclude:
  - ".git"
  - docs
  - tests
  - __pycache__
  - "*.egg-info"
  - "*.pyc"
listing:
  title: "Grant Radar - Questbook competitive intel"
  description: "A live scan of every grant currently accepting applications on Questbook (reward, network, deadline, applicant count) - or a deep competitive brief on one grant: RFP essentials plus every public competitor application grouped by state, approved ones first. Questbook's public API exposes the full text of competing applications and almost nobody reads it; this agent does. Fetched fresh at job time, no accounts, no credentials - open-source core (grant-radar-mcp, MIT)."
  category: Research
  price: 5
  output: markdown
inputs:
  - label: "Grant id"
    type: text
